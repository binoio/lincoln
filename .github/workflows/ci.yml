name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  core-tests:
    name: LincolnCore tests (Linux container)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build test image and run swift test
        run: docker build --progress=plain -t lincoln-core-tests .
